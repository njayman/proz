# proz tray for sway. Install: cp proz.conf ~/.config/sway/ and add
#   include ~/.config/sway/proz.conf
# to ~/.config/sway/config.
# 'exec' runs once per login, never on reload, so there is one tray. The
# session env goes to systemd first, so apps opened from the tray menu
# (Resume) can reach Wayland. Logs: journalctl --user -u proz-tray
exec sh -c 'systemctl --user import-environment WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP; systemctl --user restart proz-tray.service'
