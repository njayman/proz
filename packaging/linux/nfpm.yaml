# The Linux packages (.deb, .rpm, Arch) of the desktop build, made by
# scripts/package-linux.sh. nfpm expands ${GOARCH} and ${VERSION} from the
# environment (not in paths); paths are relative to the repo root.
name: proz
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: Najish Mahmud <40840185+njayman@users.noreply.github.com>
description: |
  A local-first tracker for projects, ideas and milestones.
  Includes the launcher window (proz gui), the tray and the CLI.
vendor: proz
homepage: https://github.com/njayman/proz
license: GPL-3.0-only

contents:
  - src: dist/linux/proz
    dst: /usr/bin/proz
    file_info: {mode: 0755}
  - src: packaging/linux/proz.desktop
    dst: /usr/share/applications/proz.desktop
    file_info: {mode: 0644}
  - src: packaging/proz.svg
    dst: /usr/share/icons/hicolor/scalable/apps/proz.svg
    file_info: {mode: 0644}

# The launcher (Fyne, GLFW) links OpenGL and Wayland, and loads the X11 and
# keyboard libraries at run time.
overrides:
  deb:
    depends: [libc6, libgl1, libx11-6, libxcursor1, libxrandr2, libxinerama1, libxi6, libxxf86vm1, libwayland-client0, libwayland-cursor0, libwayland-egl1, libxkbcommon0]
  rpm:
    depends: [glibc, libglvnd-glx, libX11, libXcursor, libXrandr, libXinerama, libXi, libXxf86vm, libwayland-client, libwayland-cursor, libwayland-egl, libxkbcommon]
  archlinux:
    depends: [glibc, libglvnd, libx11, libxcursor, libxrandr, libxinerama, libxi, libxxf86vm, wayland, libxkbcommon]
