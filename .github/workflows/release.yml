name: Build and release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions: write-all
    # the tray needs cgo on macOS only, so darwin builds on a macOS runner
    runs-on: ${{ matrix.goos == 'darwin' && 'macos-latest' || 'ubuntu-latest' }}

    strategy:
      matrix:
        goos: [linux, windows, darwin]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: 386

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Define Output Filename and Archive Name
        id: set_names
        run: |
          BINARY_NAME="proz"
          ARCHIVE_BASE_NAME="proz-${{ matrix.goos }}-${{ matrix.goarch }}" # Base name for the archive file
          ARCHIVE_EXT=""

          if [ "${{ matrix.goos }}" == "windows" ]; then
            BINARY_NAME="${BINARY_NAME}.exe"
            ARCHIVE_EXT=".zip"
          else
            ARCHIVE_EXT=".tar.gz"
          fi

          ARCHIVE_FULL_NAME="${ARCHIVE_BASE_NAME}${ARCHIVE_EXT}"

          echo "BINARY_NAME=${BINARY_NAME}" >> $GITHUB_ENV
          echo "ARCHIVE_BASE_NAME=${ARCHIVE_BASE_NAME}" >> $GITHUB_ENV # Store base name for archive
          echo "ARCHIVE_FULL_NAME=${ARCHIVE_FULL_NAME}" >> $GITHUB_ENV # Store full name for upload
          echo "ARCHIVE_EXT=${ARCHIVE_EXT}" >> $GITHUB_ENV

      - name: Build Go binary
        run: |
          mkdir -p dist
          go build -trimpath -tags tray -ldflags="-s -w -X github.com/njayman/proz/cmd.version=${GITHUB_REF_NAME#v}" -o dist/${{ env.BINARY_NAME }} .
          ls -lh dist/
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: ${{ matrix.goos == 'darwin' && '1' || '0' }}

      - name: Package Binary
        run: |
          cd dist
          if [ "${{ matrix.goos }}" == "windows" ]; then
            zip -r "${{ env.ARCHIVE_FULL_NAME }}" "${{ env.BINARY_NAME }}"
          else
            tar -czvf "${{ env.ARCHIVE_FULL_NAME }}" "${{ env.BINARY_NAME }}"
          fi
          ls -lh .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_BASE_NAME }}
          path: dist/${{ env.ARCHIVE_FULL_NAME }}

  # The desktop build needs cgo, so the installer builds on Windows itself.
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the installer
        run: scripts/package-windows.ps1 -Version ($env:GITHUB_REF_NAME.TrimStart('v'))

      - name: Install, upgrade and uninstall it before releasing it
        run: scripts/check-windows-installer.ps1 dist\proz-setup-windows-amd64.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/proz-setup-windows-amd64.exe

  release:
    permissions: write-all
    needs: [build, windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Gather the release files and their checksums
        run: |
          mkdir release
          find artifacts -type f -exec mv {} release/ \;
          cd release
          sha256sum -- * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}